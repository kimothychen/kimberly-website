<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library · Kimberly Chen</title>
<meta name="description" content="Books Kimberly Chen has read, pulled live from Goodreads.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a href="/" class="topbar-name" aria-label="Kimberly Chen, home"><svg class="topbar-mark" viewBox="15 15 71 70" aria-hidden="true"><rect x="15" y="15" width="31" height="70"/><path d="M51,50 L51,15 L86,15 A35,35 0 0 0 51,50 Z"/><path d="M51,50 A35,35 0 0 0 86,85 L51,85 Z"/></svg></a>
  <nav class="topbar-nav" aria-label="Primary">
    <a href="/#about">About</a>
    <a href="/#work">Work</a>
    <a href="/library" class="is-active" aria-current="page">My Library</a>
    <a href="/rotation">My Rotation</a>
    <a href="/#contact">Contact</a>
  </nav>
</header>

<span class="spine" aria-hidden="true">Kimberly Chen · Library</span>

<main class="page">

  <section class="hero library-hero">
    <h1 class="display display-library">Library</h1>

    <div class="library-meta">
      <dl class="info">
        <dt>Shelf:</dt><dd>Read</dd>
        <dt>Volumes:</dt><dd id="countBooks">—</dd>
        <dt>Authors:</dt><dd id="countAuthors">—</dd>
      </dl>

      <div class="sort" role="group" aria-label="Sort books">
        <span class="label">Sort:</span>
        <button type="button" data-sort="recent" class="is-active">Recent</button>
        <button type="button" data-sort="title">Title</button>
        <button type="button" data-sort="author">Author</button>
      </div>
    </div>
  </section>

  <section class="now-reading" id="nowReading" hidden>
    <div class="section-head">
      <span>Currently reading</span>
      <span></span>
    </div>
    <ul class="now-list" id="nowList"></ul>
  </section>

  <section class="shelf-wrap">
    <div class="section-head">
      <span>Read</span>
      <span></span>
    </div>
    <p class="shelf-status label" id="shelfStatus">Loading the shelf…</p>
    <ol class="shelf" id="shelf"></ol>
  </section>

  <div class="row-foot library-foot">
    <span>© 2026 Kimberly Chen</span>
    <span>New York, NY</span>
  </div>

</main>

<span class="corner" aria-hidden="true"></span>

<script src="js/library.js"></script>
</body>
</html>
